name: Build and Release ChordOPython

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11.9'

      - name: Unzip chords.zip
        run: |
          unzip chords_diagram/chords.zip -d chords_diagram
          rm chords_diagram/chords.zip

      - name: Upgrade pip and install base dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install numpy

      - name: Install Vamp plugins (Linux)
        run: |
          chmod +x ./vamp/vamp-plugins-linux
          sudo cp ./vamp/vamp-linux /usr/local/bin/vamp-plugins-linux
          echo "VAMP_PATH=$PWD/vamp/vamp-plugins-linux" >> $GITHUB_ENV

      - name: Install remaining dependencies
        run: |
          pip install -r req/requirements.txt

      - name: Build ChordOPython (Linux)
        run: python setup_cxfreeze.py build

      - uses: actions/upload-artifact@v4
        with:
          name: ChordOPython-ubuntu
          path: build/exe.linux-*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11.9'

      - name: Install build tools
        run: choco install 7zip -y

      - name: Unzip chords.zip
        run: |
          7z x "chords_diagram\chords.zip" -o"chords_diagram" -y
          del chords_diagram\chords.zip
        shell: pwsh

      - name: Upgrade pip and install base dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install numpy

      - name: Extract and install Vamp (Windows)
        run: |
          7z x "vamp/vampy-windows.zip" -o"vamp/vamp-windows" -y
          cd vamp/vamp-windows
          pip install .
        shell: pwsh

      - name: Install remaining dependencies
        run: |
          pip install -r req/requirements.txt

      - name: Build ChordOPython (Windows)
        run: python setup_cxfreeze.py build
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: ChordOPython-windows
          path: build/exe.win*

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Add gettext to PATH
        run: echo "/usr/local/opt/gettext/bin" >> $GITHUB_PATH
        shell: bash

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11.9'

      - name: Unzip chords.zip
        run: |
          unzip chords_diagram/chords.zip -d chords_diagram
          rm chords_diagram/chords.zip

      - name: Upgrade pip and install base dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install numpy

      - name: Install Vamp plugins (macOS)
        run: |
          hdiutil attach ./vamp/vamp-plugins-mac.dmg
          echo "VAMP_PATH=$PWD/vamp/vamp-plugins-mac.dmg" >> $GITHUB_ENV

      - name: Install remaining dependencies
        run: |
          pip install -r req/requirements.txt

      - name: Build ChordOPython (macOS)
        run: python setup_cxfreeze.py build

      - uses: actions/upload-artifact@v4
        with:
          name: ChordOPython-macos
          path: build/exe.macosx-*
