name: Build and Release ChordOPython

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11.9'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ unzip
          python -m pip install --upgrade pip setuptools wheel

      - name: Unzip chords.zip
        run: |
          unzip chords_diagram/chords.zip -d chords_diagram
          rm chords_diagram/chords.zip

      - name: Install Python dependencies
        run: |
          pip install numpy nuitka
          pip install -r req/requirements.txt


      - name: Build with Nuitka
        run: |
          nuitka main.py \
            --standalone \
            --onefile \
            --output-dir=dist/output \
            --remove-output \
            --enable-plugin=tk-inter \
            --include-data-dir="chords_diagram=chords_diagram" \
            --include-data-dir="datatypes=datatypes" \
            --include-data-dir="images=images" \
            --include-data-dir="vamp=vamp" \
            --output-filename=ChordOPython

      - name: Compress artifact
        run: zip -r ChordOPython-ubuntu.zip dist/output/*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChordOPython-ubuntu
          path: ChordOPython-ubuntu.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11.9'

      - name: Install Chocolatey build tools
        run: choco install mingw 7zip -y

      - name: Unzip chords.zip
        run: |
          7z x "chords_diagram\chords.zip" -o"chords_diagram" -y
          del chords_diagram\chords.zip
        shell: pwsh
      - name: Extract and install Vamp (Windows)
        run: |
          pip install numpy
          7z x "vamp/vampy-windows.zip" -o"vamp/vamp-windows" -y
          cd vamp/vamp-windows
          pip install .
        shell: pwsh
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install numpy nuitka
          pip install -r req/requirements.txt


      - name: Build with Nuitka
        run: |
          nuitka main.py `
            --standalone `
            --onefile `
            --output-dir=dist\output `
            --remove-output `
            --enable-plugin=tk-inter `
            --include-data-dir="chords_diagram=chords_diagram" `
            --include-data-dir="datatypes=datatypes" `
            --include-data-dir="images=images" `
            --include-data-dir="vamp=vamp" `
            --output-filename=ChordOPython
        shell: pwsh

      - name: Compress artifact
        run: |
          Compress-Archive -Path .\dist\output\* -DestinationPath .\ChordOPython-windows.zip
        shell: pwsh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChordOPython-windows
          path: ChordOPython-windows.zip

  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11.9'

      - name: Install build dependencies
        run: |
          brew install gcc unzip
          python -m pip install --upgrade pip setuptools wheel

      - name: Unzip chords.zip
        run: |
          unzip chords_diagram/chords.zip -d chords_diagram
          rm chords_diagram/chords.zip

      - name: Install Python dependencies
        run: |
          pip install numpy nuitka
          pip install -r req/requirements.txt


      - name: Build with Nuitka
        run: |
          nuitka main.py \
            --standalone \
            --onefile \
            --output-dir=dist/output \
            --remove-output \
            --enable-plugin=tk-inter \
            --include-data-dir="chords_diagram=chords_diagram" \
            --include-data-dir="datatypes=datatypes" \
            --include-data-dir="images=images" \
            --include-data-dir="vamp=vamp" \
            --output-filename=ChordOPython

      - name: Compress artifact
        run: zip -r ChordOPython-macos.zip dist/output/*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChordOPython-macos
          path: ChordOPython-macos.zip
